<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryuten renderer</title>
  <style>
    :root { color-scheme: dark; font-family: "Titillium Web", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #123c4c; }
    body { background: linear-gradient(155deg, #0c8190 0%, #145c76 42%, #252d67 77%, #452448 100%); }
    #game { display: block; width: 100%; height: 100%; }
    #brand { position: fixed; top: 25px; left: 42px; color: #fff; font: 600 42px/1 "Titillium Web", sans-serif; letter-spacing: .08em; text-shadow: 0 2px 10px #03131d; }
    #brand small { display: block; margin-top: 5px; font: 400 11px/1 "Segoe UI", sans-serif; letter-spacing: .25em; opacity: .72; }
    #topbar { position: fixed; top: 26px; right: 18px; display: flex; gap: 5px; padding: 8px 14px; border-radius: 4px; background: rgba(17, 19, 28, .78); box-shadow: 0 3px 18px rgba(0,0,0,.25); }
    #topbar span { color: #f3f3f5; font: 600 17px/1 "Titillium Web", sans-serif; letter-spacing: .03em; }
    #topbar span + span::before { content: "•"; color: #76d1dc; margin: 0 13px; }
    #server { position: fixed; left: 18px; bottom: 18px; padding: 10px 14px; min-width: 168px; border-left: 3px solid #f18ac7; background: rgba(9, 17, 31, .78); box-shadow: 0 3px 18px rgba(0,0,0,.22); }
    #server strong { display: block; color: #fff; font: 600 18px/1.1 "Titillium Web", sans-serif; }
    #server em { display: block; color: #b9dfe3; font: 400 12px/1.4 "Segoe UI", sans-serif; font-style: normal; }
    #status { position: fixed; right: 16px; bottom: 14px; color: rgba(255,255,255,.75); font: 12px/1 "Segoe UI", sans-serif; }
    #error { position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); display: none; width: min(450px, 80vw); padding: 18px; border: 1px solid rgba(255,190,220,.5); border-radius: 8px; background: rgba(20, 12, 28, .9); color: #fff; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Ryuten game view"></canvas>
  <div id="brand">RYUTEN<small>ONYX CONNECTED VIEW</small></div>
  <div id="topbar"><span>SENPA</span><span>INVENTORY</span><span>REPLAYS</span><span>SETTINGS</span></div>
  <div id="server"><strong id="server-name">Connecting…</strong><em id="server-mode">Waiting for world data</em></div>
  <div id="status">Connecting to Onyx…</div>
  <div id="error"></div>
  <script src="renderer.js"></script>
</body>
</html>
